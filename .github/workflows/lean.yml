name: Lean — every theorem, every break

# Re-verifies the program's machine-checked claims on every push: each suite's theorems must CHECK and each
# deliberate break must FAIL (a suite whose breaks pass is blind, and fails here). Also fails if runs/INDEX.md —
# the generated track record — is stale against the run directories. Public repo: no Actions cost.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # runs-index.py reads the commit that ADDED each PREREG; a shallow clone cannot see it

      - name: Install Lean (the version pinned in lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve the pinned lean binary
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          echo "LEAN=$(elan which lean)" >> "$GITHUB_ENV"
          "$(elan which lean)" --version

      - name: Run every suite
        run: |
          fail=0
          for s in control/run.sh sangaha/run.sh kala/run.sh matika/run.sh rung4/run.sh runs/*/run.sh; do
            [ -f "$s" ] || continue
            echo "::group::$s"
            if sh "$s"; then echo "✓ $s" >> "$GITHUB_STEP_SUMMARY"
            else echo "✗ $s" >> "$GITHUB_STEP_SUMMARY"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail

      - name: The dissertation's numbers are current (every count it quotes, regenerated from the Lean)
        run: sh dissertation/reproduce.sh --check-numbers

      - name: The track record is current
        run: python3 scripts/runs-index.py --check

      # matika/RELATA is generated from scripts/relata.py's clause table (no CST needed to build it). --check also refuses a
      # reading that cites the held-out answer it is tested against (the first version did; its refuter caught it, 2026-10-13)
      - name: The relata are current and answer-free
        run: python3 scripts/relata.py --check

      # kala/THEOREMS.md is generated from the Lean (tools/Uses.lean reads which axioms each proof reaches). It also
      # fails if any proof uses `sorry`, reaches a HELD OUT axiom, or if a live axiom cites the lines an answer cites.
      - name: The theorems list is current, and no proof reasons from a held-out answer
        run: python3 scripts/theorems-index.py --check

      # A388 OQ3: a premise SET that yields a held-out answer in one bounded `grind` step is a LEAK (fails) — or, on the
      # run's own known answer, a TRIVIAL reproduction (reported).
      - name: No premise set restates a held-out answer
        run: python3 scripts/leak-check.py

      # A399 OQ-3 (founder 2026-10-13, "approve"): the REFUSAL and DETECTION side as a property — every prereg.py refusal,
      # LEAK, STATED NEGATION, NONE NEAR, ERROR, the anchored harness, a BLIND break and the drift guard are planted once and
      # must each be seen to fire; one valid control must be ACCEPTED (a tool that refused everything would pass the rest)
      - name: The instrument's refusals and detections fire (planted)
        run: python3 scripts/selftest.py
